<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowT" cx="0.8" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowS" cx="0.72" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#ef9fb4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ef9fb4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a0b"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowT)"/>
  <rect width="1600" height="1000" fill="url(#glowS)"/>

  <text x="1552" y="66" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="4" fill="#ededee" fill-opacity="0.42">PROJECT 01 // INFRASTRUCTURE AS CODE</text>
  <text x="1560" y="966" font-family="Syne, sans-serif" font-weight="800" font-size="300" fill="#ffffff" fill-opacity="0.045">01</text>

  <!-- terraform badge -->
  <g>
    <rect x="920" y="140" width="470" height="58" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="944" y="155" width="28" height="28" rx="7" fill="none" stroke="#c39a5b" stroke-width="1.6"/>
    <text x="958" y="175" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#c39a5b">Tf</text>
    <text x="992" y="165" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="500" fill="#ededee">Terraform: infrastructure as code</text>
    <text x="992" y="185" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#ededee" fill-opacity="0.5">one command rebuilds the whole stack</text>
  </g>

  <!-- connectors -->
  <line x1="956" y1="277" x2="956" y2="332" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="956" y1="375" x2="956" y2="430" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="1390,375 1405,375 1405,350 1420,350" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <polyline points="1390,169 1402,169 1402,440 1420,440" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- route 53 -->
  <g>
    <rect x="920" y="240" width="470" height="74" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="956" cy="277" r="13" fill="none" stroke="#2dd4bf" stroke-width="1.6"/>
    <ellipse cx="956" cy="277" rx="5.5" ry="13" fill="none" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <line x1="943" y1="277" x2="969" y2="277" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="986" y="272" font-family="IBM Plex Mono, monospace" font-size="15.5" font-weight="500" fill="#ededee">Route 53</text>
    <text x="986" y="295" font-family="IBM Plex Mono, monospace" font-size="12" fill="#ededee" fill-opacity="0.5">public DNS for the app</text>
  </g>
  <!-- EC2 -->
  <g>
    <rect x="920" y="338" width="470" height="74" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="944" y="359" width="24" height="36" rx="4" fill="none" stroke="#c9402a" stroke-width="1.6"/>
    <line x1="944" y1="371" x2="968" y2="371" stroke="#c9402a" stroke-opacity="0.7" stroke-width="1.2"/>
    <line x1="944" y1="383" x2="968" y2="383" stroke="#c9402a" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="986" y="370" font-family="IBM Plex Mono, monospace" font-size="15.5" font-weight="500" fill="#ededee">EC2 Ubuntu</text>
    <text x="986" y="393" font-family="IBM Plex Mono, monospace" font-size="12" fill="#ededee" fill-opacity="0.5">Nginx · PM2 · app containers</text>
  </g>
  <!-- RDS -->
  <g>
    <rect x="920" y="436" width="470" height="74" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <ellipse cx="956" cy="454" rx="12" ry="4.5" fill="none" stroke="#ef9fb4" stroke-width="1.6"/>
    <path d="M944 454 v18 a12 4.5 0 0 0 24 0 v-18" fill="none" stroke="#ef9fb4" stroke-width="1.6"/>
    <path d="M944 463 a12 4.5 0 0 0 24 0" fill="none" stroke="#ef9fb4" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="986" y="468" font-family="IBM Plex Mono, monospace" font-size="15.5" font-weight="500" fill="#ededee">RDS PostgreSQL</text>
    <text x="986" y="491" font-family="IBM Plex Mono, monospace" font-size="12" fill="#ededee" fill-opacity="0.5">private subnet · encrypted</text>
  </g>

  <!-- side cards -->
  <g>
    <rect x="1420" y="318" width="160" height="64" rx="12" fill="#121214" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="1440" y="344" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#ededee">ECR</text>
    <text x="1440" y="364" font-family="IBM Plex Mono, monospace" font-size="11" fill="#ededee" fill-opacity="0.45">container images</text>
  </g>
  <g>
    <rect x="1420" y="408" width="160" height="64" rx="12" fill="#121214" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="1440" y="434" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#ededee">S3</text>
    <text x="1440" y="454" font-family="IBM Plex Mono, monospace" font-size="11" fill="#ededee" fill-opacity="0.45">terraform state</text>
  </g>

  <text x="920" y="576" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#ededee" fill-opacity="0.5">EC2 · RDS · ECR · Route 53 · security groups, defined in .tf and applied with review</text>
</svg>
