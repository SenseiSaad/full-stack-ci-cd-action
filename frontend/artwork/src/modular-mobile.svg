<svg xmlns="http://www.w3.org/2000/svg" width="750" height="520" viewBox="0 0 750 520">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowT" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowS" cx="0.92" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ef9fb4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ef9fb4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="750" height="520" fill="#0a0a0b"/>
  <rect width="750" height="520" fill="url(#grid)"/>
  <rect width="750" height="520" fill="url(#glowT)"/>
  <rect width="750" height="520" fill="url(#glowS)"/>

  <text x="84" y="52" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="4" fill="#ededee" fill-opacity="0.42">PROJECT 02 // BACKEND API</text>

  <!-- DRF badge -->
  <g>
    <rect x="80" y="80" width="590" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="102" y="93" width="28" height="28" rx="8" fill="none" stroke="#2dd4bf" stroke-width="1.6"/>
    <text x="116" y="113" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#2dd4bf">DR</text>
    <text x="148" y="104" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#ededee">Django REST Framework</text>
    <text x="148" y="124" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#ededee" fill-opacity="0.5">the modular API backing this portfolio</text>
  </g>

  <!-- endpoints -->
  <g>
    <rect x="80" y="150" width="590" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="112" cy="177" r="6" fill="#2dd4bf"/>
    <text x="144" y="172" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#ededee">GET /api/projects</text>
    <text x="144" y="192" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#ededee" fill-opacity="0.5">portfolio projects</text>
  </g>
  <g>
    <rect x="80" y="216" width="590" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="112" cy="243" r="6" fill="#c39a5b"/>
    <text x="144" y="238" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#ededee">GET /api/experience</text>
    <text x="144" y="258" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#ededee" fill-opacity="0.5">work history</text>
  </g>
  <g>
    <rect x="80" y="282" width="590" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="112" cy="309" r="6" fill="#ef9fb4"/>
    <text x="144" y="304" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#ededee">GET /api/logs</text>
    <text x="144" y="324" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#ededee" fill-opacity="0.5">engineering write-ups</text>
  </g>
  <g>
    <rect x="80" y="348" width="590" height="54" rx="14" fill="#121214" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="112" cy="375" r="6" fill="#c9402a"/>
    <text x="144" y="370" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="500" fill="#ededee">POST /api/contact</text>
    <text x="144" y="390" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#ededee" fill-opacity="0.5">contact form intake</text>
  </g>

  <g>
    <rect x="80" y="432" width="590" height="44" rx="12" fill="#121214" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="106" y="459" font-family="IBM Plex Mono, monospace" font-size="13.5" fill="#ededee" fill-opacity="0.75"><tspan font-weight="500" fill="#ededee">Docker Compose</tspan><tspan fill="#ededee" fill-opacity="0.45">: api · postgres, local matches production</tspan></text>
  </g>
</svg>
